<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181818">
<title>Simple Planner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#181818}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid #e9e9e7;padding:24px 16px;display:flex;flex-direction:column;z-index:20}.logo{width:34px;height:34px;background:#181818;color:#fff;border-radius:9px;display:grid;place-items:center;font-weight:800}.brand{font-weight:750;margin:10px 7px 35px;font-size:14px}.brand span{display:block;font-weight:400;color:#999;font-size:11px;margin-top:3px}.sidebar nav{display:grid;gap:3px}.nav{border:0;background:none;text-align:left;padding:11px 12px;border-radius:8px;color:#777}.nav:hover,.nav.active{background:#f0f0ee;color:#111;font-weight:650}.backup{margin-top:auto;border:1px solid #ddd;background:#fff;border-radius:8px;padding:9px;color:#555}
main{margin-left:220px;max-width:1050px;padding:38px 45px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}#eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:#999;margin:0}h1{font-size:29px;margin:4px 0 0}.add,.primary{background:#181818;color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:650}.secondary{border:1px solid #ddd;background:#fff;color:#444;border-radius:8px;padding:10px 14px}.card{background:#fff;border:1px solid #e8e8e6;border-radius:13px;padding:19px;margin-bottom:14px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.card h2{font-size:17px;margin:0}.muted{color:#929292;font-size:12px}.empty{text-align:center;padding:35px 10px;color:#aaa;font-size:13px;line-height:1.6}
.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0ef}.task:last-child{border:0}.check{width:21px;height:21px;border:1.5px solid #bbb;background:#fff;border-radius:6px;display:grid;place-items:center;flex:none;padding:0}.check.done{background:#181818;color:#fff;border-color:#181818}.task-name{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}.task.done .task-name{text-decoration:line-through;color:#aaa}.delete{border:0;background:none;color:#bbb;font-size:18px;padding:4px 6px}.progress{height:7px;background:#ededeb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#181818;border-radius:99px}.goal{display:grid;gap:12px}.goal-meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#888}.goal-actions{display:flex;gap:6px;flex-wrap:wrap}.small-btn{border:1px solid #ddd;background:#fff;border-radius:7px;padding:7px 9px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.review{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.review .card{margin:0}.stat{font-size:30px;font-weight:800}.stat-label{font-size:12px;color:#999}
.dump-input{display:flex;gap:10px;align-items:flex-end;margin-bottom:20px}.dump-input textarea{flex:1;min-height:85px;resize:vertical;margin:0}.dump-input .add{height:42px}.dump{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #eee}.dump:last-child{border:0}.dump-text{font-size:14px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.dump-actions{display:flex;gap:6px;align-items:flex-start;flex:none}
dialog{border:0;border-radius:14px;padding:22px;width:min(460px,calc(100vw - 28px));max-height:calc(100dvh - 28px);overflow:auto;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0005}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:none;font-size:22px;color:#888}label{display:block;font-size:12px;font-weight:650;color:#555;margin-top:14px}input,textarea,select{width:100%;margin-top:6px;border:1px solid #ddd;border-radius:8px;padding:10px;background:#fff;outline:0;color:#181818}input:focus,textarea:focus,select:focus{border-color:#999}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.light{font-weight:400;color:#aaa}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:18px;bottom:18px;background:#181818;color:#fff;padding:11px 14px;border-radius:8px;font-size:12px;z-index:1000}
@media(max-width:700px){body{padding-bottom:72px}.sidebar{inset:auto 0 0 0;width:100%;height:66px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border:0;border-top:1px solid #e9e9e7;display:block}.logo,.brand,.backup{display:none}.sidebar nav{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:100%}.nav{text-align:center;padding:10px 2px;font-size:11px}.nav.active{background:#f0f0ee}main{margin:0;width:100%;padding:20px 13px 28px}header{margin-bottom:18px}h1{font-size:25px}.add{padding:9px 12px;font-size:13px}.grid,.review{grid-template-columns:1fr}.dump-input{display:block}.dump-input textarea{min-height:105px}.dump-input .add{width:100%;height:44px;margin-top:8px}.dump{display:block}.dump-actions{margin-top:10px}.dump-actions .small-btn{flex:1}.two{grid-template-columns:1fr}.card{padding:15px;border-radius:12px}.task-name{font-size:13px}dialog{width:calc(100vw - 20px);padding:18px;border-radius:16px}.toast{left:12px;right:12px;bottom:76px;text-align:center}}
@media(max-width:380px){main{padding-left:10px;padding-right:10px}.nav{font-size:10px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">P</div><div class="brand">Simple Planner<span>Do what matters.</span></div>
  <nav><button class="nav active" data-page="today">Today</button><button class="nav" data-page="dump">Brain Dump</button><button class="nav" data-page="goals">Goals</button><button class="nav" data-page="progress">Progress</button></nav>
  <button id="backup" class="backup">Backup</button>
</aside>
<main>
  <header><div><p id="eyebrow">TODAY</p><h1 id="title">Today</h1></div><button id="addButton" class="add">+ Add task</button></header>
  <div id="content"></div>
</main>
<input id="importFile" type="file" accept=".json,application/json" hidden>

<dialog id="taskModal"><form id="taskForm"><div class="modal-head"><h2>Add task</h2><button type="button" class="close" data-close>×</button></div><label>What needs to be done?<input id="taskName" required placeholder="e.g. Solve 20 DSA questions"></label><label>When?<input id="taskDate" type="date" required></label><label>Goal <span class="light">(optional)</span><select id="taskGoal"><option value="">No goal</option></select></label><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Add task</button></div></form></dialog>
<dialog id="goalModal"><form id="goalForm"><div class="modal-head"><h2>New goal</h2><button type="button" class="close" data-close>×</button></div><label>Goal<input id="goalName" required placeholder="e.g. Run 1,000 km"></label><div class="two"><label>Target<input id="goalTarget" type="number" min="0" step="any" required placeholder="1000"></label><label>Unit<input id="goalUnit" required placeholder="km"></label></div><label>Deadline<input id="goalDate" type="date" required></label><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Create goal</button></div></form></dialog>
<dialog id="progressModal"><form id="progressForm"><div class="modal-head"><h2>Update progress</h2><button type="button" class="close" data-close>×</button></div><input type="hidden" id="progressId"><label id="progressLabel">Current progress<input id="progressValue" type="number" min="0" step="any" required></label><div class="actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save</button></div></form></dialog>

<script>
const KEY="simple-planner-v4", DEFAULT={tasks:[],goals:[],dump:[]};
let state=load(),page="today";
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&Array.isArray(x.tasks)&&Array.isArray(x.goals)&&Array.isArray(x.dump)?x:structuredClone(DEFAULT)}catch{return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function addDays(date,n){const d=new Date(date+"T00:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0}
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function openModal(x){document.getElementById(x).showModal()}
function closeModals(){document.querySelectorAll("dialog[open]").forEach(x=>x.close())}
function render(){const titles={today:["TODAY","Today"],dump:["BRAIN DUMP","Brain Dump"],goals:["GOALS","Goals"],progress:["PROGRESS","Progress"]};document.getElementById("eyebrow").textContent=titles[page][0];document.getElementById("title").textContent=titles[page][1];document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===page));const b=document.getElementById("addButton");if(page==="today"){b.textContent="+ Add task";b.onclick=openTask}else if(page==="dump"){b.textContent="+ Capture";b.onclick=()=>document.getElementById("inlineDumpText")?.focus()}else if(page==="goals"){b.textContent="+ Goal";b.onclick=openGoal}else{b.textContent="+ Add task";b.onclick=openTask}document.getElementById("content").innerHTML=page==="today"?todayPage():page==="dump"?dumpPage():page==="goals"?goalsPage():progressPage()}
function todayPage(){const ts=state.tasks.filter(x=>x.date===today()),done=ts.filter(x=>x.done).length,p=ts.length?Math.round(done/ts.length*100):0;return `<div class="card"><div class="card-head"><div><h2>${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</h2><span class="muted">${done} of ${ts.length} completed</span></div><div><div class="stat">${p}%</div><div class="stat-label">done</div></div></div><div class="progress"><i style="width:${p}%"></i></div></div><div class="card"><div class="card-head"><h2>Today's tasks</h2><span class="muted">${ts.length} tasks</span></div>${ts.length?ts.map(taskHTML).join(""):`<div class="empty">Nothing planned for today.<br>Add only what you actually want to complete.</div>`}</div><div class="grid"><div class="card"><div class="card-head"><h2>Active goals</h2></div>${state.goals.slice(0,3).map(goalMini).join("")||`<div class="empty">No goals yet.</div>`}</div><div class="card"><div class="card-head"><h2>Quick thought</h2><span class="muted">Brain Dump</span></div><div class="dump-input" style="margin:0"><textarea id="quickThought" placeholder="Capture a thought..."></textarea><button class="add" onclick="captureQuickThought()">Capture</button></div></div></div>`}
function taskHTML(t){const g=t.goalId?state.goals.find(x=>x.id===t.goalId):null;return `<div class="task ${t.done?"done":""}"><button class="check ${t.done?"done":""}" onclick="toggleTask('${t.id}')">${t.done?"✓":""}</button><div class="task-name">${esc(t.name)}</div>${g?`<span class="muted">${esc(g.name)}</span>`:""}<button class="delete" onclick="removeTask('${t.id}')">×</button></div>`}
function dumpPage(){return `<div class="card"><div class="card-head"><div><h2>Brain Dump</h2><span class="muted">Write everything. Organize later.</span></div></div><div class="dump-input"><textarea id="inlineDumpText" placeholder="What's on your mind?"></textarea><button class="add" onclick="saveInlineDump()">Capture</button></div>${state.dump.length?state.dump.map(dumpHTML).join(""):`<div class="empty">Nothing here yet.<br>Dump anything that's on your mind.</div>`}</div>`}
function dumpHTML(d){return `<div class="dump"><div style="flex:1;min-width:0"><div class="dump-text">${esc(d.text)}</div><div class="muted" style="margin-top:5px">${new Date(d.createdAt).toLocaleString()}</div></div><div class="dump-actions"><button class="small-btn" onclick="makeTask('${d.id}')">Make task</button><button class="delete" onclick="removeDump('${d.id}')">×</button></div></div>`}
function captureQuickThought(){const x=document.getElementById("quickThought"),text=x?.value.trim();if(!text){toast("Write something first");x?.focus();return}state.dump.unshift({id:id(),text,createdAt:Date.now()});save();x.value="";toast("Captured to Brain Dump")}
function saveInlineDump(){const x=document.getElementById("inlineDumpText"),text=x?.value.trim();if(!text){toast("Write something first");x?.focus();return}state.dump.unshift({id:id(),text,createdAt:Date.now()});save();render();toast("Captured")}
function makeTask(did){const d=state.dump.find(x=>x.id===did);if(!d)return;state.tasks.push({id:id(),name:d.text,date:today(),goalId:"",done:false});state.dump=state.dump.filter(x=>x.id!==did);save();page="today";render();toast("Added to today")}
function removeDump(did){state.dump=state.dump.filter(x=>x.id!==did);save();render();toast("Removed")}
function goalsPage(){return `<div class="card"><div class="card-head"><div class="muted">Set the destination. Today handles the actions.</div><button class="add" onclick="openGoal()">+ Goal</button></div></div>${state.goals.map(goalCard).join("")||`<div class="card empty">No goals yet.<br>Create one simple outcome.</div>`}`}
function goalCard(g){const p=pct(g.current,g.target),rem=Math.max(0,g.target-g.current),days=Math.ceil((new Date(g.deadline+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000),daily=days>0?rem/days:rem;return `<div class="card goal"><div class="goal-meta"><span>${esc(g.name)}</span><span>${Math.round(p)}%</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="goal-meta"><span>${g.current} / ${g.target} ${esc(g.unit)}</span><span>${days>=0?days+" days left":"deadline passed"}</span></div><div class="muted">Suggested daily progress: <b>${daily.toFixed(2)} ${esc(g.unit)}</b></div><div class="goal-actions"><button class="small-btn" onclick="updateGoal('${g.id}')">Update progress</button><button class="delete" onclick="removeGoal('${g.id}')">×</button></div></div>`}
function goalMini(g){const p=pct(g.current,g.target);return `<div style="margin:12px 0"><div class="goal-meta"><span>${esc(g.name)}</span><span>${Math.round(p)}%</span></div><div class="progress" style="margin-top:7px"><i style="width:${p}%"></i></div></div>`}
function openGoal(){document.getElementById("goalDate").value=addDays(today(),30);openModal("goalModal")}
function addGoal(e){e.preventDefault();const name=document.getElementById("goalName").value.trim(),target=Number(document.getElementById("goalTarget").value),unit=document.getElementById("goalUnit").value.trim(),deadline=document.getElementById("goalDate").value;if(!name||!Number.isFinite(target)||target<=0||!unit||!deadline){toast("Fill all goal fields");return}state.goals.push({id:id(),name,target,current:0,unit,deadline});save();closeModals();e.target.reset();render();toast("Goal created")}
function updateGoal(gid){const g=state.goals.find(x=>x.id===gid);if(!g)return;document.getElementById("progressId").value=gid;document.getElementById("progressValue").value=g.current;document.getElementById("progressLabel").firstChild.textContent=`Current progress (${g.unit})`;openModal("progressModal")}
function saveProgress(e){e.preventDefault();const g=state.goals.find(x=>x.id===document.getElementById("progressId").value);if(g){let v=Number(document.getElementById("progressValue").value);g.current=Number.isFinite(v)?Math.max(0,Math.min(g.target,v)):0}save();closeModals();render();toast("Progress updated")}
function removeGoal(gid){if(!confirm("Delete this goal?"))return;state.goals=state.goals.filter(x=>x.id!==gid);state.tasks.forEach(t=>{if(t.goalId===gid)t.goalId=""});save();render();toast("Goal deleted")}
function openTask(){const s=document.getElementById("taskGoal");s.innerHTML=`<option value="">No goal</option>`+state.goals.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join("");document.getElementById("taskDate").value=today();openModal("taskModal")}
function addTask(e){e.preventDefault();const name=document.getElementById("taskName").value.trim(),date=document.getElementById("taskDate").value,goalId=document.getElementById("taskGoal").value;if(!name||!date){toast("Enter a task and date");return}state.tasks.push({id:id(),name,date,goalId,done:false});save();closeModals();e.target.reset();render();toast("Task added")}
function toggleTask(tid){const t=state.tasks.find(x=>x.id===tid);if(t)t.done=!t.done;save();render()}
function removeTask(tid){state.tasks=state.tasks.filter(x=>x.id!==tid);save();render();toast("Task deleted")}
function progressPage(){const ts=state.tasks.filter(x=>x.date<=today()),done=ts.filter(x=>x.done).length;return `<div class="review"><div class="card"><div class="stat">${done}</div><div class="stat-label">tasks completed</div></div><div class="card"><div class="stat">${state.goals.length}</div><div class="stat-label">active goals</div></div><div class="card"><div class="stat">${state.dump.length}</div><div class="stat-label">brain dump items</div></div></div><div class="card" style="margin-top:14px"><div class="card-head"><h2>Goals</h2></div>${state.goals.map(goalMini).join("")||`<div class="empty">No progress yet.</div>`}</div><div class="card"><div class="card-head"><h2>Data</h2></div><div class="goal-actions"><button class="small-btn" onclick="backup()">Export backup</button><button class="small-btn" onclick="document.getElementById('importFile').click()">Import backup</button><button class="small-btn" onclick="clearAllData()">Clear all data</button></div></div>`}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="simple-planner-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast("Backup exported")}
function importBackup(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.goals)||!Array.isArray(d.dump))throw Error();state=d;save();render();toast("Backup imported")}catch{toast("Invalid backup file")}e.target.value=""};r.readAsText(f)}
function clearAllData(){if(!confirm("Delete all tasks, goals and brain dump items?"))return;state=structuredClone(DEFAULT);save();render();toast("All data cleared")}
document.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo({top:0,behavior:"smooth"})});document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModals);document.getElementById("taskForm").onsubmit=addTask;document.getElementById("goalForm").onsubmit=addGoal;document.getElementById("progressForm").onsubmit=saveProgress;document.getElementById("backup").onclick=backup;document.getElementById("importFile").onchange=importBackup;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModals();if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&document.activeElement?.id==="inlineDumpText")saveInlineDump()});render()});
</script>
</body>
</html>
